name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unittest:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Helper tests
        run: |
          python -B -m unittest discover \
            -s plugins/setup-agentic-workflow/shared/tests -v
      - name: Helpers stay importable and syntax-clean
        run: |
          python -m compileall -q \
            plugins/setup-agentic-workflow/shared/scripts
  hooks:
    name: hooks self-check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: sh plugins/setup-agentic-workflow/hooks/test.sh
