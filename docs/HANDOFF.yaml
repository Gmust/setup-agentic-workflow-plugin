decisions:
  - handoff is YAML snapshot not MD log — read cost dominates, ~120 tokens vs 1.5k
  - hooks live in plugin (personal), repo gets rule + file; settings.json hooks only on request
  - PreCompact not used — cannot make the model write; counter bounds staleness
  - dual-review is a separate plugin, recommended by setup (owner's call, reverses the 2.1 decision); one folder serves plugin and zip installs
  - REVIEW.md only when the team uses AI review; facts from the repo, never a stack checklist (code.claude.com/docs/en/code-review)
  - stale-base check compares baseRefOid with origin/<base>: GitHub moves baseRefOid when the head is pushed, not when the base advances, which is the case that matters
