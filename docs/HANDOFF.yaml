decisions:
  - handoff is YAML snapshot not MD log — read cost dominates, ~120 tokens vs 1.5k
  - hooks live in plugin (personal), repo gets rule + file; settings.json hooks only on request
  - PreCompact not used — cannot make the model write; counter bounds staleness
  - dual-review is a separate plugin, recommended by setup, never installed by it
  - REVIEW.md only when the team uses AI review; facts from the repo, never a stack checklist
  - stale-base check compares baseRefOid with origin/<base> (GitHub moves baseRefOid on head push, not on base advance)
  - roadmap holds only milestones the user names; asked once, never generated — generating would break "will not invent a spec"
  - a spec framework in use (OpenSpec config.yaml context, specs/, changes/) is linked, never restated in AGENTS.md — two copies drift
